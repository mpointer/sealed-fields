name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run --coverage
      - run: npm run build
      - name: Verify publishable contents
        run: npm pack --dry-run

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
        sqlalchemy: ["1.4.*", "2.*"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "./python[sqlalchemy]" "SQLAlchemy==${{ matrix.sqlalchemy }}" pytest pytest-cov build
      - run: pytest python/tests -q --cov=sealed_fields --cov-report=term --cov-fail-under=90
      - name: Verify the sdist and wheel build
        run: python -m build python --outdir /tmp/sf-dist
